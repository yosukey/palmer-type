name: Type Check

on:
  pull_request:
    branches: [main]

jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: src/requirements.txt
      - name: Install dependencies
        run: pip install -r src/requirements.txt mypy
      - name: Run mypy
        run: mypy
